spring.application.name=Devprath
server.port=${PORT:8080}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.profiles.active=dev

# Enable graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Maximum number of active connections to keep in the pool (5-10 is plenty for 1 admin)
spring.datasource.hikari.maximum-pool-size=10

# Minimum idle connections
spring.datasource.hikari.minimum-idle=2

# How long (in ms) to wait for a connection from the pool before timing out (30 seconds)
spring.datasource.hikari.connection-timeout=30000

# Max time (10 minutes) a connection can stay idle
spring.datasource.hikari.idle-timeout=600000

# Max lifetime of a connection in the pool (30 minutes)
spring.datasource.hikari.max-lifetime=1800000

