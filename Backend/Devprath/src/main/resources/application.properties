spring.application.name=Devprath
server.port=${PORT:8080}

# JPA
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.profiles.active=dev
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://devprathconstructions.vercel.app}

SPRING_PROFILES_ACTIVE=dev

# Startup
spring.main.lazy-initialization=false

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# cloudflare turnstile
# site.key=0x4AAAAAAE32Pw9QivldjMWo
ds.cf.turnstile.secret=0x4AAAAAAE32P5W0iTqIVpj78zzQ5t6k43c

# Pagination
spring.paging.DEFAULT_PAGE_SIZE=5